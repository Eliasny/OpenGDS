# System users of the OpenGDS units (packaging/systemd/):
#   opengds     opengdsd; owns the store in /var/lib/opengds (group-readable)
#   opengds-ca  opengds-signer; owns the CA key in /var/lib/opengds-signer.
#               Reads the store through SupplementaryGroups=opengds in
#               opengds-signer@.service, so it is not a member here.
# SPDX-License-Identifier: MPL-2.0
u opengds    - "OpenGDS Global Discovery Server" /var/lib/opengds
u opengds-ca - "OpenGDS signer (CA key holder)"  /var/lib/opengds-signer
