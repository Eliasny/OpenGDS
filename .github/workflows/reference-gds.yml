# OpenGDS T0 gate: the GDS spec tests against the OPC Foundation .NET
# reference GDS (UA-.NETStandard-Samples, pinned commit). Reference deviations
# are recorded in tools/auditor/profile_gds/expected/dotnet_reference.csv;
# the job fails when a verdict changes.
# SPDX-License-Identifier: MPL-2.0
name: reference-gds

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled (no failure email); every push
  # to main still runs to the end so each merge commit is tested.
  group: reference-gds-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SAMPLES_COMMIT: 2941c8d1ad3c18aaee13acc16bd2ec9f9f6cc8ed

jobs:
  dotnet-reference:
    name: spec tests vs .NET reference GDS
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev python3
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-gcc-release-${{ hashFiles('scripts/build_open62541.sh', 'scripts/build_openssl.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10 (pinned, hardened)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Build gdsaudit
        run: |
          cmake -S . -B build -G Ninja -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          cmake --build build --target gdsaudit
      - name: Fetch the reference GDS (pinned)
        run: |
          git init -q "${{ runner.temp }}/samples"
          cd "${{ runner.temp }}/samples"
          git fetch -q --depth 1 https://github.com/OPCFoundation/UA-.NETStandard-Samples.git "$SAMPLES_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SAMPLES_COMMIT"
      - name: .NET SDK
        run: dotnet --list-sdks
      - name: Spec tests vs reference GDS
        run: >
          tools/auditor/reference/run_dotnet_gds.sh build/tools/auditor/gdsaudit
          "${{ runner.temp }}/samples" "${{ runner.temp }}/ref-run"
      - name: Keep the TAP and logs
        if: always()
        run: |
          for f in reference.tap gds.log; do
            echo "::group::$f"; cat "${{ runner.temp }}/ref-run/$f" 2>/dev/null; echo "::endgroup::"
          done

  push-vs-dotnet:
    name: push tracer vs .NET reference Server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev python3
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-gcc-release-${{ hashFiles('scripts/build_open62541.sh', 'scripts/build_openssl.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10 (pinned, hardened)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Build opengdsd, opengds-signer, gdsadm, pull_test_client
        run: |
          cmake -S . -B build -G Ninja -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          cmake --build build --target opengdsd opengds-signer gdsadm pull_test_client
      - name: Fetch the .NET reference Server (pinned)
        run: |
          git init -q "${{ runner.temp }}/samples"
          cd "${{ runner.temp }}/samples"
          git fetch -q --depth 1 https://github.com/OPCFoundation/UA-.NETStandard-Samples.git "$SAMPLES_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SAMPLES_COMMIT"
      - name: gdsadm push now -> .NET Server
        run: >
          tests/integration/push/run_push_vs_dotnet.sh build "${{ runner.temp }}/samples"
          "${{ runner.temp }}/push-dotnet"
