# The Auditor client profile against a pull-managed client built on the OPC
# Foundation .NET GDS client library (UA-.NETStandard, pinned tag and commit;
# the trigger hook is tools/auditor/reference/dotnet_pull_client). Reference
# deviations are recorded in
# tools/auditor/profile_client/expected/dotnet_reference.csv; the job fails
# when a verdict changes. This is the .NET half of the AT3 gate.
# SPDX-License-Identifier: MPL-2.0
name: reference-client

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded pull request runs are cancelled (no failure email); every push
  # to main still runs to the end so each merge commit is tested.
  group: reference-client-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UANETSTANDARD_TAG: 1.5.378.182
  UANETSTANDARD_COMMIT: 6cca32dd6d79c8b57d2e00e4d2071b991d2cf71b

jobs:
  dotnet-reference-client:
    name: client profile vs .NET GDS client library
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev python3
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-gcc-release-${{ hashFiles('scripts/build_open62541.sh', 'scripts/build_openssl.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10 (pinned, hardened)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Build gdsaudit
        run: |
          cmake -S . -B build -G Ninja -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          cmake --build build --target gdsaudit
      - name: Cache the NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-uanetstandard-${{ env.UANETSTANDARD_COMMIT }}
      - name: Fetch UA-.NETStandard (pinned)
        run: |
          git init -q "${{ runner.temp }}/uanetstandard"
          cd "${{ runner.temp }}/uanetstandard"
          git fetch -q --depth 1 https://github.com/OPCFoundation/UA-.NETStandard.git "refs/tags/$UANETSTANDARD_TAG"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$UANETSTANDARD_COMMIT"
      - name: .NET SDK
        run: dotnet --list-sdks
      - name: Client profile vs .NET pull client
        run: >
          tools/auditor/reference/run_dotnet_client.sh build/tools/auditor/gdsaudit
          "${{ runner.temp }}/uanetstandard" "${{ runner.temp }}/ref-run"
      - name: Keep the TAP and logs
        if: always()
        run: |
          for f in reference.tap verdicts.csv client.log build.log; do
            echo "::group::$f"; cat "${{ runner.temp }}/ref-run/$f" 2>/dev/null || true; echo "::endgroup::"
          done
      - name: Upload the verdicts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-client-verdicts
          path: |
            ${{ runner.temp }}/ref-run/reference.tap
            ${{ runner.temp }}/ref-run/verdicts.csv
          if-no-files-found: ignore
