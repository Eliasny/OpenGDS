# OpenGDS CI (docs/architecture.md, "Analysis and testing that enforces the rules")
# SPDX-License-Identifier: MPL-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Dispatched by automerge after each merge (GITHUB_TOKEN pushes start no runs).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer run on the same ref cancels the older one, on main too: only the
  # latest main commit is tested, which keeps the shared runner queue short
  # enough for automerge to get a runner.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.cc }} ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        variant: [release, asan-ubsan]
        include:
          - cc: clang
            variant: tsan
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev libseccomp-dev python3 libgtk-4-dev xvfb
      - name: Sanitizer settings
        id: san
        run: |
          case "${{ matrix.variant }}" in
            asan-ubsan) echo "flags=address,undefined" >> "$GITHUB_OUTPUT" ;;
            tsan)       echo "flags=thread" >> "$GITHUB_OUTPUT" ;;
            *)          echo "flags=" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-${{ matrix.cc }}-${{ matrix.variant }}-${{ hashFiles('scripts/build_open62541.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10 (pinned, hardened)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          SANITIZE: ${{ steps.san.outputs.flags }}
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          -DOPENGDS_SANITIZE="${{ steps.san.outputs.flags }}"
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:suppressions=${{ github.workspace }}/tsan.supp
        # the slow client tests (ctest -L slow, about 6 minutes) run locally
        run: ctest --test-dir build --output-on-failure -LE slow
      - name: Check binary hardening
        if: matrix.variant == 'release'
        run: |
          for b in build/tools/auditor/push_test_server build/tools/auditor/pull_test_client \
                   build/tools/auditor/mock_gds build/tools/auditor/push_driver; do
            readelf -h "$b" | grep -q 'DYN' || { echo "$b is not PIE"; exit 1; }
            readelf -d "$b" | grep -q 'BIND_NOW' || readelf -d "$b" | grep -q 'FLAGS.*NOW' || { echo "$b lacks BIND_NOW"; exit 1; }
            readelf -l "$b" | grep -q 'GNU_RELRO' || { echo "$b lacks RELRO"; exit 1; }
            readelf -lW "$b" | grep 'GNU_STACK' | grep -q 'RWE' && { echo "$b has an executable stack"; exit 1; }
            nm -D "$b" | grep -q '__stack_chk_fail' || { echo "$b lacks stack protector"; exit 1; }
            nm -D "$b" | grep -q '_chk@' || { echo "$b lacks FORTIFY"; exit 1; }
            echo "$b: PIE, full RELRO, NX, canary, FORTIFY"
          done

  windows-wine:
    # gdsaudit.exe (packaging/windows/build.sh) under Wine against the Linux
    # pins: packaging/windows/check_under_wine.sh, about 25 minutes. Only on
    # pull requests that touch the Auditor or its Windows packaging (or this
    # file, so a change to the job is tested by the job).
    name: windows gdsaudit.exe under wine
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Does this pull request touch the Auditor?
        id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -qE '^(tools/auditor/|packaging/windows/|src/common/platform\.h$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No change under tools/auditor or packaging/windows: skipped"
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies, MinGW-w64 and Wine
        if: steps.scope.outputs.run == 'true'
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          ninja-build libsqlite3-dev libseccomp-dev python3 zip
          gcc-mingw-w64-x86-64-win32 binutils-mingw-w64-x86-64 mingw-w64-x86-64-dev wine64
      - name: Cache pinned OpenSSL 3.5
        if: steps.scope.outputs.run == 'true'
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.scope.outputs.run == 'true' && steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        if: steps.scope.outputs.run == 'true'
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-gcc-release-${{ hashFiles('scripts/build_open62541.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10
        if: steps.scope.outputs.run == 'true' && steps.cache.outputs.cache-hit != 'true'
        env:
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Build the Linux self-test targets
        if: steps.scope.outputs.run == 'true'
        run: |
          cmake -S . -B build -G Ninja -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" \
              -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          cmake --build build --target push_test_server mock_gds
      - name: Cache the Windows OpenSSL and open62541
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/win64
          key: win64-deps-${{ hashFiles('scripts/build_openssl.sh', 'scripts/build_open62541.sh', 'docs/upstream/patches/v1.5.10/*.patch', 'packaging/windows/mingw64.cmake') }}
      - name: Build gdsaudit.exe
        if: steps.scope.outputs.run == 'true'
        run: sh packaging/windows/build.sh "${{ runner.temp }}/winpkg" "${{ runner.temp }}/win64"
      - name: gdsaudit.exe under Wine against the Linux pins
        if: steps.scope.outputs.run == 'true'
        run: |
          exe=$(find "${{ runner.temp }}/winpkg/build" -name gdsaudit.exe | head -1)
          sh packaging/windows/check_under_wine.sh build/tools/auditor "$exe" "${{ runner.temp }}/wine-check"
      - name: Keep the engine for the installer job
        if: steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gdsaudit-windows-engine
          path: ${{ runner.temp }}/winpkg/gdsaudit-*-windows-x86_64/
          retention-days: 7

  windows-msi:
    # The desktop UI on Windows (Auditor plan AT5): gdsaudit-gui built with
    # MSYS2's GTK 4 (UCRT64), packed with the engine of windows-wine into an
    # MSI (packaging/windows/msi/), installed silently, smoke-tested and
    # uninstalled. Same pull requests as windows-wine.
    name: windows desktop installer (msi)
    needs: windows-wine
    if: github.event_name == 'pull_request' && needs.windows-wine.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-adwaita-icon-theme mingw-w64-ucrt-x86_64-ntldd
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gdsaudit-windows-engine
          path: ${{ runner.temp }}/engine
      - name: Build gdsaudit-gui and stage it with the engine
        run: sh packaging/windows/msi/build_gui.sh "$(cygpath -u '${{ runner.temp }}')/msi" "$(cygpath -u '${{ runner.temp }}')/engine"
      - name: View-model tests (plan, history) on Windows
        run: ctest --test-dir "$(cygpath -u '${{ runner.temp }}')/msi/build" --output-on-failure
      - name: Pack the MSI (WiX 5)
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          $v = (Select-String -Path CMakeLists.txt -Pattern '^project\(OpenGDS VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          wix build packaging/windows/msi/gdsaudit.wxs -arch x64 -d Version=$v -d "Stage=${{ runner.temp }}\msi\stage" -o "${{ runner.temp }}\gdsaudit.msi"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Install silently, smoke-test, uninstall
        shell: pwsh
        run: |
          $msi = "${{ runner.temp }}\gdsaudit.msi"
          $dir = "$env:ProgramFiles\OpenGDS Auditor\bin"
          $p = Start-Process msiexec -ArgumentList "/i `"$msi`" /qn /l*v `"${{ runner.temp }}\install.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "${{ runner.temp }}\install.log" -Tail 50; exit 1 }
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\OpenGDS Auditor.lnk")) { "no Start menu shortcut"; exit 1 }
          # the installed engine, then the installed UI (no MSYS2 on PATH)
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          & "$dir\gdsaudit.exe" server --work "${{ runner.temp }}\work" --init-only
          if ($LASTEXITCODE -ne 0) { "engine --init-only failed"; exit 1 }
          $gui = Start-Process "$dir\gdsaudit-gui.exe" -ArgumentList "--smoke" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { "gdsaudit-gui --smoke exit $($gui.ExitCode)"; exit 1 }
          # the UI's engine link (named pipes, pause, resume, abort) with the
          # installed engine and the installed DLLs
          Copy-Item "${{ runner.temp }}\msi\build\tools\auditor\avm\test_avm_engine.exe" $dir
          & "$dir\test_avm_engine.exe" "$dir\gdsaudit.exe" "${{ runner.temp }}\engine-run"
          if ($LASTEXITCODE -ne 0) { "test_avm_engine failed"; exit 1 }
          Remove-Item "$dir\test_avm_engine.exe"
          $p = Start-Process msiexec -ArgumentList "/x `"$msi`" /qn" -Wait -PassThru
          if ($p.ExitCode -ne 0) { "uninstall exit $($p.ExitCode)"; exit 1 }
          if (Test-Path "$env:ProgramFiles\OpenGDS Auditor") { "files left after uninstall"; exit 1 }
          "ok: installed, engine and UI ran, uninstalled"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: gdsaudit-windows-msi
          path: |
            ${{ runner.temp }}/gdsaudit.msi
            ${{ runner.temp }}/install.log
          retention-days: 7

  analysis:
    name: static analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev libseccomp-dev python3 clang-tidy cppcheck libgtk-4-dev
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-gcc-release-${{ hashFiles('scripts/build_open62541.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CC: gcc
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: GCC -fanalyzer
        run: |
          cmake -S . -B build-analyzer -G Ninja -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-fanalyzer" -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          cmake --build build-analyzer
      - name: clang-tidy
        run: |
          cmake -S . -B build-tidy -G Ninja -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
          # docs/spikes: throwaway evidence code, not built or held to the rules
          git ls-files '*.c' ':!docs/' | xargs clang-tidy -p build-tidy --quiet --warnings-as-errors='*'
      - name: cppcheck
        run: >
          cppcheck --enable=warning,portability,performance --error-exitcode=1
          --inline-suppr --std=c11 -I src -I tools/auditor/core
          --suppress=missingIncludeSystem src tools
      - name: Banned functions
        run: |
          if git grep -nE '\b(strcpy|strcat|sprintf|vsprintf|gets|strtok|atoi|atol|atof|system|popen|tmpnam|mktemp)\s*\(' -- '*.c' '*.h' ':!src/common/banned.h' ':!docs/'; then
            echo "banned function used (docs/architecture.md)"; exit 1
          fi
