# OpenGDS nightly fuzzing (docs/architecture.md, "Analysis and testing that
# enforces the rules"): every libFuzzer target in tests/fuzz under ASan and
# UBSan. The corpus grows between runs (actions/cache); a crash fails the
# job and its input is uploaded as an artifact.
# SPDX-License-Identifier: MPL-2.0
name: fuzz

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Run time per target in seconds
        default: '600'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [fuzz_csr, fuzz_app_record, fuzz_signer_msg, fuzz_daemon_config, fuzz_users,
                 fuzz_trustlist]
    env:
      CC: clang
      SECONDS_PER_TARGET: ${{ inputs.seconds || '600' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install build dependencies
        # libclang-rt-18-dev: libFuzzer and the sanitizer runtimes for clang 18
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build libsqlite3-dev python3 libclang-rt-18-dev
      - name: Cache pinned OpenSSL 3.5
        id: ossl
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/openssl
          key: openssl-3.5.9-${{ hashFiles('scripts/build_openssl.sh') }}
      - name: Build OpenSSL 3.5.9 (pinned, checksum-verified)
        if: steps.ossl.outputs.cache-hit != 'true'
        run: scripts/build_openssl.sh "${{ runner.temp }}/openssl"
      - name: Cache pinned open62541
        id: cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/open62541
          key: open62541-v1.5.10-clang-fuzz-${{ hashFiles('scripts/build_open62541.sh', 'docs/upstream/patches/v1.5.10/*.patch') }}
      - name: Build open62541 v1.5.10 (pinned, ASan + UBSan, coverage-instrumented)
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          # fuzzer-no-link: libFuzzer also sees coverage inside the decoders
          SANITIZE: address,undefined,fuzzer-no-link
          OPENSSL_ROOT: ${{ runner.temp }}/openssl
        run: scripts/build_open62541.sh "${{ runner.temp }}/open62541"
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang -DOPENGDS_FUZZ=ON
          -DOPENGDS_BUILD_AUDITOR=OFF
          -DOPEN62541_PREFIX="${{ runner.temp }}/open62541" -DOPENSSL_ROOT_DIR="${{ runner.temp }}/openssl"
      - name: Build
        run: cmake --build build --target ${{ matrix.target }}
      - name: Restore corpus
        uses: actions/cache/restore@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          mkdir -p fuzz-corpus crashes
          # New inputs go to fuzz-corpus; the committed seeds are read too
          build/tests/fuzz/${{ matrix.target }} -max_total_time="$SECONDS_PER_TARGET" \
            -rss_limit_mb=2048 -timeout=25 -print_final_stats=1 \
            -artifact_prefix=crashes/ fuzz-corpus "tests/fuzz/corpus/${{ matrix.target }}"
      - name: Minimise corpus
        if: always()
        run: |
          mkdir -p fuzz-corpus-min
          build/tests/fuzz/${{ matrix.target }} -merge=1 -rss_limit_mb=2048 -timeout=25 \
            fuzz-corpus-min fuzz-corpus "tests/fuzz/corpus/${{ matrix.target }}" \
            && rm -rf fuzz-corpus && mv fuzz-corpus-min fuzz-corpus || true
      - name: Save corpus
        if: always()
        uses: actions/cache/save@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: fuzz-corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crashes-${{ matrix.target }}
          path: crashes/
          if-no-files-found: ignore
