# Merges a pull request by itself once every check on its head commit has passed.
# Elias, 6 Nov 2026: "Prs should be automatically checked and passed".
#
# Runs from main (workflow_run always uses the default branch's copy of this
# file), so a pull request cannot change the rules that merge it. Only pull
# requests from branches of this repository are merged; drafts and forks never
# are. Every CI workflow must be listed under `workflows:` and its required
# jobs under REQUIRED, or a PR could merge before they finish.
# SPDX-License-Identifier: MPL-2.0
name: automerge

on:
  workflow_run:
    workflows: [ci, reference-gds, release]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  # GITHUB_TOKEN pushes (the merge) start no workflows, so main's CI is
  # dispatched explicitly after each merge.
  actions: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.event.workflow_run.head_sha }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      # Every job of every CI workflow. A workflow that is still queued has no
      # check runs yet, so the gate must name each job, not only count pending ones.
      REQUIRED: "gcc release|gcc asan-ubsan|clang release|clang asan-ubsan|clang tsan|static analysis|spec tests vs .NET reference GDS|push tracer vs .NET reference Server"
    steps:
      - name: Merge if every check on the head commit passed
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --head "$BRANCH" \
                 --json number,headRefOid,isDraft \
                 --jq ".[] | select(.headRefOid == \"$SHA\" and (.isDraft | not)) | .number")
          if [ -z "$pr" ]; then
            echo "No open, non-draft pull request at $SHA; nothing to merge."
            exit 0
          fi
          runs=$(gh api "repos/$REPO/commits/$SHA/check-runs?per_page=100")
          # Every check run on the head commit must be finished and green ...
          pending=$(echo "$runs" | jq '[.check_runs[] | select(.status != "completed" or
                      (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral"))] | length')
          if [ "$pending" != "0" ]; then
            echo "$pending check(s) on $SHA are not green yet; not merging."
            exit 0
          fi
          # ... and every required job must have run and passed.
          IFS='|' read -ra req <<< "$REQUIRED"
          for name in "${req[@]}"; do
            ok=$(echo "$runs" | jq --arg n "$name" '[.check_runs[] | select(.name == $n and .conclusion == "success")] | length')
            if [ "$ok" = "0" ]; then
              echo "Required check '$name' has not passed on $SHA; not merging."
              exit 0
            fi
          done
          # Only a failure Elias must act on fails this job (GitHub emails him
          # for failed runs he is the actor of). Conflicts are fixed by whoever
          # owns the PR and a lost race with a parallel run is harmless, so
          # those end green with a warning annotation instead.
          if out=$(gh pr merge "$pr" --repo "$REPO" --squash --match-head-commit "$SHA" 2>&1); then
            echo "Merged #$pr at $SHA."
            for wf in ci.yml reference-gds.yml; do gh workflow run "$wf" --repo "$REPO" --ref main || echo "::warning::could not start $wf on main"; done
            exit 0
          fi
          echo "$out"
          state=$(gh pr view "$pr" --repo "$REPO" --json state --jq .state)
          if [ "$state" != "OPEN" ]; then
            echo "#$pr is already $state; nothing to do."
            exit 0
          fi
          case "$out" in
            *"workflows"*"permission"*)
              # GITHUB_TOKEN may not merge changes under .github/workflows.
              echo "::error::#$pr changes a workflow; GITHUB_TOKEN cannot merge it. Merge it by hand."
              exit 1 ;;
            *)
              echo "::warning::#$pr was not merged at $SHA (conflict or not mergeable yet); a later push will retry."
              exit 0 ;;
          esac
